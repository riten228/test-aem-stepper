<div class="form-wizard cmp-adaptiveform-wizard--vertical-stepper"
     data-form-wizard-submit="${properties.showSubmit ? 'true' : 'false'}"
     data-form-wizard-submit-label="${properties.submitLabel}"
     data-form-wizard-i18n-step="${'Step {0} of {1}' @ i18n}"
     data-form-wizard-i18n-previous="${'Previous' @ i18n}"
     data-form-wizard-i18n-next="${'Next' @ i18n}"
     data-form-wizard-i18n-submit="${'Submit' @ i18n}">
    <span hidden data-sly-list.rule="${properties.skipRules}" data-skip-rule="${rule}"></span>
    <sly data-sly-resource="${resource.path @ resourceType='core/fd/components/form/wizard/v1/wizard'}"/>
</div>
